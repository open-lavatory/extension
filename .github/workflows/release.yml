name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0

      - name: Check tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version v$version" >&2
            exit 1
          fi

      - name: Install dependencies
        env:
          pnpm_config_ignore_scripts: "true"
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec wxt prepare

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build zip
        run: pnpm exec wxt zip -b chrome

      - name: Check built manifest version
        run: |
          version=$(node -p 'require("./package.json").version')
          built=$(node -p 'const m = require("./.output/chrome-mv3/manifest.json"); m.version_name ?? m.version')
          if [ "$built" != "$version" ]; then
            echo "Built manifest version $built does not match package.json version $version" >&2
            exit 1
          fi

      - name: Stage release files
        run: |
          version=$(node -p 'require("./package.json").version')
          zip="openlv-connect-$version-chrome.zip"
          mkdir release
          cp ".output/$zip" release/
          cd release
          sha256sum "$zip" > "$zip.sha256"

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test onboarding page
        run: |
          chromium=$(node -e 'import("playwright").then(({ chromium }) => console.log(chromium.executablePath()))')
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$chromium" node --test tests/onboarding.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Pack crx
        env:
          CRX_KEY: ${{ secrets.CRX_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          name="openlv-connect-${TAG#v}-chrome"
          unzip -q "release/$name.zip" -d "$RUNNER_TEMP/extension"
          if [ -n "$(find "$RUNNER_TEMP/extension" ! -type f ! -type d)" ]; then
            echo "The zip has entries that are not regular files" >&2
            exit 1
          fi
          key=$(mktemp "$RUNNER_TEMP/crx-key.XXXXXX")
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$CRX_KEY" > "$key"
          unset CRX_KEY
          id() { sha256sum | cut -c1-32 | tr 0-9a-f a-p; }
          crx_id=$(openssl pkey -in "$key" -pubout -outform DER | id)
          manifest_id=$(jq -r .key "$RUNNER_TEMP/extension/manifest.json" | base64 -d | id)
          if [ "$crx_id" != "$manifest_id" ]; then
            echo "The crx ID $crx_id does not match the manifest key ID $manifest_id" >&2
            exit 1
          fi
          google-chrome --pack-extension="$RUNNER_TEMP/extension" --pack-extension-key="$key"
          mkdir signed
          mv "$RUNNER_TEMP/extension.crx" "signed/$name.crx"
          cd signed
          sha256sum "$name.crx" > "$name.crx.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crx
          path: signed/
          if-no-files-found: error

  attest:
    needs: [build, sign]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crx
          path: signed

      - name: Check release files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="openlv-connect-${TAG#v}-chrome"
          diff <(ls release) <(printf '%s\n' "$name.zip" "$name.zip.sha256")
          diff <(ls signed) <(printf '%s\n' "$name.crx" "$name.crx.sha256")

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.zip
            signed/*.crx

  release:
    needs: [build, sign, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crx
          path: signed

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          name="openlv-connect-${TAG#v}-chrome"
          diff <(ls release) <(printf '%s\n' "$name.zip" "$name.zip.sha256")
          diff <(ls signed) <(printf '%s\n' "$name.crx" "$name.crx.sha256")
          (cd release && sha256sum --check --strict ./*.sha256)
          (cd signed && sha256sum --check --strict ./*.sha256)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* signed/* --clobber
          else
            gh release create "$TAG" release/* signed/* --verify-tag --title "$TAG" --generate-notes
          fi
